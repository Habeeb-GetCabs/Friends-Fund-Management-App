name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Installable Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 22 (No lockfile required)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Setup Java JDK 21 (Required for Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Normalize package.json for Public NPM Registry & Install Dependencies
        run: |
          node -e '
            const fs = require("fs");
            const pkg = {
              name: "friends-savings-loan-manager",
              private: true,
              version: "2.0.0",
              type: "module",
              scripts: {
                dev: "vite",
                build: "vite build",
                preview: "vite preview"
              },
              dependencies: {
                "@capacitor/android": "^7.0.0",
                "@capacitor/cli": "^7.0.0",
                "@capacitor/core": "^7.0.0",
                "@tailwindcss/vite": "^4.0.9",
                "@vitejs/plugin-react": "^4.3.4",
                "lucide-react": "^0.475.0",
                "react": "^19.0.0",
                "react-dom": "^19.0.0",
                "tailwindcss": "^4.0.9",
                "vite": "^6.2.0",
                "vite-plugin-pwa": "^0.21.1"
              },
              devDependencies: {
                "@types/node": "^22.10.0",
                "@types/react": "^19.0.0",
                "@types/react-dom": "^19.0.0",
                "typescript": "^5.7.3"
              }
            };
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '
          npm install --legacy-peer-deps

      - name: 5. Build Offline Web Application Bundle
        run: |
          npm run build

      - name: 6. Generate & Sync Native Android Project via Capacitor
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 7. Apply Custom App Icon & Auto-Incrementing Version for Seamless App Updates
        run: |
          # 1. Install consistent signing certificate into ~/.android/debug.keystore
          # so every APK build shares the exact same signature and updates cleanly over the installed app
          mkdir -p ~/.android
          rm -f ~/.android/debug.keystore
          if [ -f "android-keystore/friends-savings.p12.b64" ]; then
            base64 -d android-keystore/friends-savings.p12.b64 > /tmp/friends-savings.p12
            keytool -importkeystore \
              -srckeystore /tmp/friends-savings.p12 \
              -srcstoretype PKCS12 \
              -srcstorepass friendsfund123 \
              -srcalias friendsfundkey \
              -destkeystore ~/.android/debug.keystore \
              -deststoretype PKCS12 \
              -deststorepass android \
              -destkeypass android \
              -destalias androiddebugkey \
              -noprompt
          fi

          # 2. Auto-increment versionCode and versionName in android/app/build.gradle
          export BUILD_VER_CODE=$((100 + ${{ github.run_number }}))
          export BUILD_VER_NAME="2.0.${{ github.run_number }}"
          sed -i "s/versionCode 1/versionCode ${BUILD_VER_CODE}/g" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${BUILD_VER_NAME}\"/g" android/app/build.gradle
          echo "Updated version in android/app/build.gradle:"
          grep -E "versionCode|versionName" android/app/build.gradle

          # 3. Inject custom Friends Savings & Loan Manager launcher icon into all Android mipmap directories
          if [ -f "public/pwa-512x512.png" ]; then
            for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              target="android/app/src/main/res/$dir"
              mkdir -p "$target"
              cp public/pwa-512x512.png "$target/ic_launcher.png"
              cp public/pwa-512x512.png "$target/ic_launcher_round.png"
              cp public/pwa-512x512.png "$target/ic_launcher_foreground.png"
            done
          fi

      - name: 8. Compile Installable Android APK via Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../Friends-Savings-Loan-Manager.apk
          ls -lh ../Friends-Savings-Loan-Manager.apk

      - name: 9. Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Friends-Savings-Loan-Manager-APK
          path: Friends-Savings-Loan-Manager.apk
          if-no-files-found: error
          retention-days: 90

      - name: 10. Publish APK to GitHub Releases
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: "Friends Savings & Loan Manager APK v2.0.${{ github.run_number }}"
          body: |
            ### Friends Savings & Interest-Free Loan Manager (Android APK v2.0.${{ github.run_number }})
            - **Custom App Icon & Consistent Update Signature**: Updates directly over existing installations while preserving all local data.
            - **Delete Any Payment or Loan Entry**: Full support for deleting any savings payment, loan repayment, or loan entry with instant balance recalculation.
            - **Working PDF & Excel (.CSV) Export & Share**: In-app preview, native Android Share/Save sheet, Print-to-PDF, and direct file export.
          files: Friends-Savings-Loan-Manager.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
